# Generated from the app logo. Keep this file beside pubspec.yaml so the
# launcher icon can be regenerated after branding changes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: '#101010'
  adaptive_icon_background: '#101010'
  adaptive_icon_foreground: assets/logo/logo.png
  macos:
    generate: true
    image_path: assets/logo/logo.png
