name: fvcksubs_app
description: fvcksubs — a multi-vertical streaming shell driven by extensions.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fvcksubs_core:
    path: ../../packages/fvcksubs_core
  fvcksubs_extension_host:
    path: ../../packages/fvcksubs_extension_host
  fvcksubs_js_runtime:
    path: ../../packages/fvcksubs_js_runtime
  fvcksubs_storage:
    path: ../../packages/fvcksubs_storage
  # Local fork: preserve the official API while exposing AVFoundation's live
  # seekable ranges and allowing live seeks beyond the 1ms indefinite duration.
  video_player:
    path: ../../packages/video_player
  video_player_android:
    path: ../../packages/video_player_android
  video_player_avfoundation:
    path: ../../packages/video_player_avfoundation
  video_player_mini_player:
    path: ../../packages/video_player_mini_player
  wakelock_plus: ^1.7.0
  cached_network_image: ^3.4.1
  html: ^0.15.6
  archive: ^4.1.0
  dio: ^5.11.0
  # 6.1.5 still references the removed proguard-android.txt API and cannot
  # evaluate with this project's current Android Gradle Plugin. The beta
  # carries the compatible Android implementation used by CloudflareKiller.
  flutter_inappwebview: 6.2.0-beta.3
  envied: ^1.3.8
  device_info_plus: ^13.2.0
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.5
  sembast: ^3.8.5+1
  flutter_secure_storage: ^11.1.1
  url_launcher: ^6.3.2
  # Resolves a YouTube video id into short-lived media streams for the Shorts
  # preview feature. Pinned to an unmerged fork commit (not the mutable
  # branch): the upstream pub.dev release fails bot-detection reliably on
  # every client except a spoofed visionOS one, which this fork adds. See
  # docs/14-shorts-preview-feed-plan.md for the probe results that led here.
  youtube_explode_dart:
    git:
      url: https://github.com/its-ashutosh-pathak/youtube_explode_dart.git
      ref: edad2760cc7998bcc18013dc9880c052ad32598f

dev_dependencies:
  build_runner: ^2.7.1
  envied_generator: ^1.3.8
  # Test-only: youtube_preview_resolver_test builds StreamInfo fixtures whose
  # codec field is a http_parser MediaType, otherwise only a transitive dep
  # of youtube_explode_dart.
  http_parser: ^4.0.0
  # Test-only: installer_controller_test builds a repo.json whose declared
  # bundle hash has to match what ExtensionInstaller computes.
  crypto: ^3.0.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo_text.png

  # Inter is bundled rather than fetched at runtime by google_fonts. With the
  # runtime fetch, the first frame laid out against a narrower fallback font
  # and text that sizes tightly to its content — the category chips — stayed
  # clipped once the real font arrived. Bundling also means text renders
  # correctly with no network at all.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
