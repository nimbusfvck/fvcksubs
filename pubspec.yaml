name: fvcksubs_workspace
publish_to: none

# Dart's native pub workspace (SDK >= 3.6). One `dart pub get` at the root
# resolves every package below, with a single shared lockfile.
#
# Melos is deliberately not here yet: nothing needs multi-package scripting
# until the Flutter app and the extension host exist.
environment:
  sdk: ^3.9.0

workspace:
  - packages/fvcksubs_core
  - packages/fvcksubs_extension_host
  - packages/fvcksubs_storage
  - packages/fvcksubs_js_runtime
  - packages/video_player_platform_interface
  - packages/video_player_android
  - packages/video_player_avfoundation
  - packages/video_player
  - packages/video_player_mini_player
  - apps/app

dev_dependencies:
  analyzer: ^12.1.0

dependency_overrides:
  # Local fork: the upstream macOS package declares 10.14 while implementing
  # an ASWebAuthenticationSession protocol requirement introduced in 10.15.
  flutter_inappwebview:
    path: packages/flutter_inappwebview/flutter_inappwebview
  flutter_inappwebview_macos:
    path: packages/flutter_inappwebview/flutter_inappwebview_macos
