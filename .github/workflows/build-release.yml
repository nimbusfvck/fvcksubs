name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/app
        run: flutter analyze

      - name: Test
        working-directory: apps/app
        run: flutter test --coverage --reporter compact

      - name: Show coverage in summary
        working-directory: apps/app
        run: |
          read -r TOTAL HIT <<EOF
          $(awk -F: '/^LF:/ { total += $2 } /^LH:/ { hit += $2 } END { print total, hit }' coverage/lcov.info)
          EOF
          if [ "${TOTAL:-0}" -gt 0 ]; then
            PERCENT=$(awk -v hit="$HIT" -v total="$TOTAL" 'BEGIN { printf "%.2f", (hit / total) * 100 }')
          else
            PERCENT="0.00"
          fi
          {
            echo "## Flutter test coverage"
            echo
            echo "| Metric | Covered | Total | Percentage |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| Lines | $HIT | $TOTAL | **${PERCENT}%** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: fvcksubs-coverage-${{ github.ref_name }}
          path: apps/app/coverage/lcov.info
          if-no-files-found: error

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Configure release signing
        working-directory: apps/app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=app/upload-keystore.jks" > key.properties

      - name: Build release APK
        working-directory: apps/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fvcksubs-apk-${{ github.ref_name }}
          path: apps/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos:
    name: macOS app
    needs: test
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Build release macOS app
        working-directory: apps/app
        run: flutter build macos --release

      - name: Package app bundle
        working-directory: apps/app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/fvcksubs.app \
            fvcksubs-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: fvcksubs-macos-${{ github.ref_name }}
          path: apps/app/fvcksubs-macos.zip
          if-no-files-found: error
